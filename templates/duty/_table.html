{% if cards %}
<table class="data">
  <thead>
    <tr>
      <th>茶园</th>
      <th>值班日</th>
      <th>班次</th>
      <th>在岗槽数上限</th>
      <th>当前萎凋中</th>
      <th>值班主管</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody>
    {% for c in cards %}
    <tr>
      <td>{{ c.garden.name }}</td>
      <td>{{ c.dutyDate|date:"Y-m-d" }}</td>
      <td>{{ c.shiftName }}</td>
      <td>{{ c.maxOnDuty }}</td>
      <td>{{ c.withering_now }}</td>
      <td>{{ c.supervisor }}</td>
      <td class="actions">
        <a class="btn btn-sm btn-secondary" href="{% url 'duty_edit' c.pk %}">编辑</a>
        <a class="btn btn-sm btn-danger" href="{% url 'duty_delete' c.pk %}">删除</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="empty">暂无值班卡，请先新建。</p>
{% endif %}
