{% extends "base.html" %}
{% block title %}删除值班卡{% endblock %}
{% block content %}
<div class="page-header">
  <h1>删除值班卡</h1>
</div>
<div class="card">
  <p>确认删除值班卡「{{ object }}」？删除后该园当日改入「萎凋中」将被拒绝（无卡）。</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">确认删除</button>
    <a class="btn btn-secondary" href="{% url 'duty_list' %}">取消</a>
  </form>
</div>
{% endblock %}
